frontier_queue:
  - id: frontier.chinese-language-pop
    priority: high
    scope: Shanghai shidaiqu, Cantopop, Mandopop, Taiwan, Hong Kong, mainland China, and diasporas
    reason: East Asian topology is misleading without Chinese-language recording, film, television, and platform circuits.
  - id: frontier.east-african-pop
    priority: high
    scope: Taarab, benga, muziki wa dansi, Ethiopian popular music, and contemporary regional circuits
    reason: Africa cannot be represented by west, central, and southern portals alone.
  - id: frontier.north-africa-southwest-asia
    priority: high
    scope: Raï, Amazigh popular music, Lebanese and pan-Arab pop, Turkish arabesk and Anatolian rock, Iranian pop and diasporas
    reason: The Egypt node must not stand for several distinct language and market worlds.
  - id: frontier.southeast-asia
    priority: high
    scope: Thai luk thung and molam, Filipino OPM, Vietnamese tân nhạc, Malaysian and Singaporean circuits
    reason: Dangdut cannot tokenistically stand for Southeast Asia.
  - id: frontier.south-asia-specificity
    priority: high
    scope: Hindi, Tamil, Telugu, Bengali, Punjabi and other film/non-film industries; Pakistani pop; Bangladeshi bands; Sri Lankan baila
    reason: Split the provisional regional node through language- and practitioner-specific work.
  - id: frontier.caribbean-beyond-reggae-salsa
    priority: high
    scope: Calypso, soca, zouk, kompa, cadence, plena, bomba, bachata, merengue, chutney, and dancehall
    reason: The Caribbean is an engine of the atlas, not a pair of source genres.
  - id: frontier.mexico-borderlands
    priority: high
    scope: Ranchera, corrido, norteño, Tejano, cumbia circuits, rock en español, and Mexican-American media
    reason: Mexico and borderlands require nodes not absorbed into generic Latin pop.
  - id: frontier.country-folk-pop
    priority: medium
    scope: North American country industries, Indigenous and Black roots, rural media, Nashville, and global country adaptations
    reason: The U.S. seed currently overconcentrates urban Black popular formations.
  - id: frontier.europe-multiple
    priority: medium
    scope: Chanson, yé-yé, Schlager, Eurovision, Italo disco, punk, and local-language pop under and after state socialism
    reason: Germany and Britain cannot stand for Europe.
  - id: frontier.gender-queer-labor
    priority: high
    scope: A cross-atlas audit of women, queer and trans creators, session labor, dancers, engineers, and informal economies
    reason: Adding famous women is insufficient if the map's unit of authorship remains the male star.
  - id: frontier.indigenous-global
    priority: high
    scope: Indigenous popular musics beyond Aotearoa, with community-controlled sources and naming
    reason: Indigenous modernities must be constitutive of the atlas rather than a diversity appendix.

