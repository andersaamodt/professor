schema: professor.research-agenda/v1
version: 1.1.0
cadence:
  horizon_scan: weekly
  deep_read: monthly
  synthesis: quarterly
  reconstruction: annually
principles:
  - Search for correction and counterevidence, not only confirmation or novelty.
  - Match methods to questions and compare across epistemic traditions.
  - Record actual reading depth and never inflate metadata or an abstract into a reading.
  - Keep learner data out of public scholarship and research out of unrequested learner time.
  - Translate findings into separate provisional proposals; never auto-promote teaching policy.
questions:
  - id: ai-scaffolding-independent-learning
    status: active
    question: Which designs for AI-supported teaching improve durable independent learning and transfer rather than only assisted performance?
    why_now: AI tutors are spreading faster than evidence about delayed transfer, dependence, and design-specific effects.
    lenses: [experimental, learning-process, metacognitive, agency, accessibility, critical-technology]
    source_routes: [primary-experiments, systematic-reviews, learning-analytics, qualitative-use-studies, corrections-and-retractions]
    watch_venues: [Journal of the Learning Sciences, Learning and Instruction, Computers & Education, npj Science of Learning, AIED and ISLS proceedings]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-08-19
    reframe_when: Independent delayed outcomes and learner agency are no longer distinguishable within one question.

  - id: assessment-and-authorship-under-ai
    status: active
    question: What forms of assessment reveal learner capability, judgment, and authorship when generative tools are ordinary parts of work?
    why_now: Product quality increasingly confounds learner knowledge with tool capability.
    lenses: [assessment-validity, authentic-practice, epistemic-agency, equity, authorship]
    source_routes: [assessment-studies, design-based-research, workplace-learning, student-and-teacher-studies, policy-evaluations]
    watch_venues: [Assessment & Evaluation in Higher Education, Educational Assessment, AERA, British Journal of Educational Technology]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-08-19
    reframe_when: Distinct domains require separate validity arguments.

  - id: durable-memory-transfer-and-calibration
    status: active
    question: How should retrieval, spacing, feedback, explanation, generation, and varied practice be combined across domains and timescales?
    why_now: Strong component findings are often overgeneralized into universal study recipes.
    lenses: [cognitive, domain-specific, developmental, affective, ecological-validity]
    source_routes: [registered-experiments, replications, meta-analyses, classroom-studies, null-results]
    watch_venues: [Journal of Educational Psychology, Educational Psychology Review, Memory & Cognition, Instructional Science]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: A component requires its own domain- and age-specific agenda.

  - id: adult-development-prior-knowledge-and-self-direction
    status: active
    question: How should teaching respond to adult authority, developmental change, domain-specific prior knowledge, material constraint, and growing self-direction without age stereotypes or abandonment?
    why_now: Adult-learning slogans often confuse ethical respect with expertise and self-direction with withdrawal of support.
    lenses: [adult-education, developmental, expertise, self-direction, critical, labor, disability, ethics]
    source_routes: [meta-analyses, longitudinal-studies, adult-literacy-and-community-scholarship, critical-adult-education, workplace-learning, learner-authored-accounts]
    watch_venues: [Adult Education Quarterly, Studies in Continuing Education, International Journal of Lifelong Education, Learning and Instruction, European Journal for Research on the Education and Learning of Adults]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: Distinct developmental periods, domains, or compulsory and voluntary settings require separate mechanism and authority models.

  - id: humanizing-critical-and-healing-pedagogies
    status: retired
    question: How do critical, culturally sustaining, decolonial, abolitionist, healing-centered, and Indigenous pedagogies change the purposes and relations of teaching?
    why_now: Technique-centered evidence can erase history, power, community knowledge, relation, and the ends education serves.
    lenses: [critical, historical, participatory, Indigenous, cultural, ethical]
    source_routes: [books, community-scholarship, participatory-research, historical-analysis, design-based-research]
    watch_venues: [Journal of the Learning Sciences, Harvard Educational Review, Equity & Excellence in Education, Indigenous education journals, ISLS proceedings]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-08-12
    reframe_when: Met on 2026-08-12; the umbrella concealed disagreement and collapsed projects with different agents, histories, ends, and claims to authority.

  - id: pedagogical-authority-voice-and-non-domination
    status: active
    question: What gives a teacher's intervention legitimate standing, how should that standing sound and remain contestable, and when must it yield or fade?
    why_now: Learner-centered and teacher-centered labels obscure whether authority is explicit, warranted, answerable, noncoercive, useful, and independence-producing.
    lenses: [philosophy-of-education, professional-ethics, rhetoric, care-ethics, disability-ethics, anti-authoritarian]
    source_routes: [philosophical-arguments, teacher-practitioner-inquiry, learner-and-community-critique, discourse-analysis, comparative-traditions]
    watch_venues: [Educational Theory, Journal of Philosophy of Education, Studies in Philosophy and Education, Ethics and Education, Philosophy of Education Yearbook]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: Institutional, custodial, epistemic, and moment-to-moment pedagogical authority require separate governing questions.

  - id: critical-pedagogies-dialogue-power-and-refusal
    status: active
    question: When do critical dialogue, voice, consciousness, explicit instruction, and emancipatory aims redistribute power, and when do they conceal or reproduce it?
    why_now: Critical pedagogy can expose domination while its own language of dialogue and empowerment can compel disclosure, assent, or participation in the Teacher's political script.
    lenses: [Freirean, feminist, Black-studies, culturally-sustaining, abolitionist, rhetorical, empirical]
    source_routes: [foundational-texts, internal-critiques, community-scholarship, classroom-cases, learner-authored-accounts]
    watch_venues: [Harvard Educational Review, Educational Theory, Curriculum Inquiry, Race Ethnicity and Education, Equity & Excellence in Education]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: A named tradition's aims or harm model become distorted by treatment as generic critical pedagogy.

  - id: indigenous-decolonial-and-sovereign-pedagogies
    status: active
    question: How should Professor encounter Indigenous and decolonial pedagogies without metaphorizing decolonization, extracting technique, or claiming community and sovereign authority it does not possess?
    why_now: Generic social-justice vocabulary can erase land, nationhood, language, consent, resurgence, Black-Indigenous relations, and the incommensurability of distinct political projects.
    lenses: [Indigenous-studies, settler-colonial-studies, Black-studies, sovereignty, land-and-language, community-accountability]
    source_routes: [Indigenous-authored-scholarship, nation-and-community-publications, primary-stories-with-permission, Black-Indigenous-dialogue, critical-counterreadings]
    watch_venues: [Decolonization Indigeneity Education & Society archive, American Indian Culture and Research Journal, Journal of American Indian Education, AlterNative, Indigenous community publications]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: Distinct nations, places, languages, or Black-Indigenous relations demand separate questions and accountable source routes.

  - id: educational-ethics-and-nonideal-judgment
    status: active
    question: How should teachers reason and act when educational goods, rights, relationships, professional duties, and structural injustices conflict and no option is clean?
    why_now: Codes and ideal theories underdescribe ordinary educational judgment, while benevolent improvisation can hide harm, moral injury, or institutional responsibility.
    lenses: [phronesis, nonideal-theory, professional-ethics, care-ethics, justice, epistemic-ethics, institutional-analysis]
    source_routes: [normative-case-studies, philosophical-arguments, practitioner-inquiry, affected-person-accounts, institutional-and-policy-analysis]
    watch_venues: [Educational Theory, Ethics and Education, Harvard Educational Review, Journal of Philosophy of Education, Teaching and Teacher Education]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: Conversational AI decisions and institutional educator dilemmas prove to have materially different responsibilities, harms, and repair agents.

  - id: access-disability-and-equivalent-participation
    status: active
    question: Which designs create genuinely equivalent participation across disability, language, bandwidth, sensory modality, and environment?
    why_now: Accessibility is often measured as format availability rather than equal intellectual opportunity.
    lenses: [disability-studies, universal-design, participatory-design, cognitive, sociotechnical]
    source_routes: [disabled-led-scholarship, accessibility-evaluations, interaction-studies, standards, participatory-design]
    watch_venues: [ACM Transactions on Accessible Computing, ASSETS, Disability & Society, CAST research, International Journal of Inclusive Education]
    last_scanned_on: 2026-08-10
    next_scan_on: 2026-09-01
    reframe_when: Affected communities define materially different access questions.

  - id: motivation-play-aesthetics-and-sustainable-effort
    status: active
    question: When do play, narrative, humor, beauty, curiosity, challenge, choice, embodied participation, and world encounter deepen learning without becoming coercion, exclusion, extraction, or spectacle?
    why_now: Engagement mechanics are easy to measure and therefore easy to mistake for educational value.
    lenses: [motivation, aesthetics, game-studies, rhetoric, affect, embodiment, place, ethics]
    source_routes: [experiments, longitudinal-studies, humanities-scholarship, game-studies, disability-led-scholarship, place-and-land-pedagogy, learner-led-design]
    watch_venues: [Contemporary Educational Psychology, Motivation and Emotion, Game Studies, Arts and Humanities in Higher Education]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: A medium or population requires a distinct mechanism and harm model.

  - id: epistemic-justice-curriculum-and-knowledge-access
    status: active
    question: How should curriculum provide access to consequential knowledge while exposing and transforming the institutions, exclusions, and legitimacy rules through which knowledge becomes canonical?
    why_now: Access to specialized knowledge can resist gatekeeping, yet canon and disciplinary authority can reproduce testimonial, hermeneutical, contributory, colonial, racial, linguistic, and class injustice.
    lenses: [social-epistemology, curriculum-theory, disciplinary-history, decolonial, critical-race, learner-and-community-authority]
    source_routes: [systematic-reviews, philosophy-of-education, disciplinary-histories, community-scholarship, curriculum-studies, learner-authored-accounts]
    watch_venues: [Review of Educational Research, Curriculum Inquiry, Journal of Curriculum Studies, Ethics and Education, Hypatia]
    last_scanned_on: 2026-08-12
    next_scan_on: 2026-09-01
    reframe_when: A discipline, community, language, or canon requires a distinct historical and authority-specific inquiry.
